name: Offline maintenance checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_distribution.py
      - run: python -m venv /tmp/pyhik-wheel
      - run: /tmp/pyhik-wheel/bin/python -m pip install --no-deps dist/*.whl
      - run: cd /tmp && /tmp/pyhik-wheel/bin/python -c "import hikvision_native; print(hikvision_native.__version__)"
      - run: cd /tmp && /tmp/pyhik-wheel/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
