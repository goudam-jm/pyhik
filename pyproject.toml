[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhik-hcnetsdk"
version = "0.1.0.dev0"
description = "Experimental Hikvision native SDK maintenance and read-only ISAPI client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{name = "Goudam Muralitharan"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/goudam-jm/pyhik"
Issues = "https://github.com/goudam-jm/pyhik/issues"

[project.optional-dependencies]
isapi = ["requests>=2.32", "defusedxml>=0.7.1"]
dev = ["build>=1.2", "ruff>=0.9", "twine>=6"]

[tool.setuptools]
py-modules = ["hikvision_native", "hikvision_isapi"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
